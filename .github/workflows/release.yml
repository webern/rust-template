name: release

# Run by hand from main: name the commit and the version it carries. The version
# must already be in Cargo.toml; bumping it is its own commit, see the
# proj-release skill. Nothing privileged runs until verify has passed.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version WITHOUT a leading v, e.g. 1.2.3 or 1.2.3-rc1 (must match Cargo.toml)"
        required: true
      sha:
        description: "Full commit SHA to release (must be on main)"
        required: true

# One release at a time, and a running one finishes.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Read-only. Every way a release can be wrong is checked here first.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Validate version input format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Stable, or stable with a prerelease suffix.
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::version must be semver like 1.2.3 or 1.2.3-rc1 (no leading 'v')."
            exit 1
          fi

      - name: Restrict to main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::This workflow must be run from main (ref was '${{ github.ref }}')."
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20
        with:
          # The ancestry check needs history.
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Validate commit is on main
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "::error::Input SHA '$RELEASE_SHA' is not an ancestor of main."
            exit 1
          fi

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v1.17.0, 2026-06-25

      - name: Install typos
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13, 2026-09-15
        with:
          tool: typos

      - name: Validate version matches Cargo.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          manifest_version=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].version')
          if [ "$manifest_version" != "$VERSION" ]; then
            echo "::error::Input version '$VERSION' does not match Cargo.toml version '$manifest_version'."
            exit 1
          fi

      - name: Validate tag does not already exist
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi

      - name: Validate version not already published
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].name')
          # crates.io answers 200 only for a version it has.
          if curl -sf "https://crates.io/api/v1/crates/$crate/$VERSION" > /dev/null; then
            echo "::error::$crate $VERSION is already published on crates.io."
            exit 1
          fi

      - name: Run CI checks
        run: make ci

      - name: Check the crate packages
        run: make check-publish

  # One archive per target, each built natively on its own runner.
  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        # Git Bash on Windows, so one packaging step serves every target.
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20
        with:
          ref: ${{ inputs.sha }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v1.17.0, 2026-06-25
        with:
          target: ${{ matrix.target }}

      # Default features, as `cargo install` would build it.
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "$TARGET"

      # <crate>-v<version>-<target>.zip on Windows, .tar.gz elsewhere.
      - name: Package
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version=1)
          crate=$(echo "$metadata" | jq -r '.packages[0].name')
          bin=$(echo "$metadata" | jq -r '[.packages[0].targets[] | select(.kind[] == "bin") | .name][0]')
          stem="$crate-v$VERSION-$TARGET"
          mkdir -p "dist/$stem"
          cp README.md LICENSE "dist/$stem/"
          case "$TARGET" in
            *windows*)
              cp "target/$TARGET/release/$bin.exe" "dist/$stem/"
              (cd dist && 7z a -tzip "$stem.zip" "$stem" > /dev/null)
              ;;
            *)
              cp "target/$TARGET/release/$bin" "dist/$stem/"
              tar -C dist -czf "dist/$stem.tar.gz" "$stem"
              ;;
          esac
          rm -r "dist/$stem"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, 2026-04-10
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Privileged: tags, creates the GitHub release, publishes the crate.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, 2026-07-20
        with:
          fetch-depth: 0
          ref: ${{ inputs.sha }}

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v1.17.0, 2026-06-25

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1, 2026-03-11
        with:
          path: dist
          merge-multiple: true

      - name: Write checksums
        env:
          VERSION: ${{ inputs.version }}
        run: |
          crate=$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[0].name')
          (cd dist && sha256sum -- * > "$crate-v$VERSION-SHA256SUMS.txt")

      - name: Tag release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          prerelease_flag=""
          # Any suffix means prerelease.
          case "$VERSION" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            $prerelease_flag \
            --generate-notes \
            dist/*

      # A short-lived token from trusted publishing; no stored secret.
      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5, 2026-06-16

      # Last, so a failure here leaves the tag and release in place to retry against.
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
